[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bingomate-edge"
version = "0.1.0"
description = "Offline-first Jetson AI companion and industrial edge lab scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyserial>=3.5"
]

[project.optional-dependencies]
mqtt = [
  "paho-mqtt>=2.0"
]
ble = [
  "bleak>=0.22"
]
cloud = [
  "openai>=1.0.0"
]

[project.scripts]
bingomate-api = "bingomate.cli:main"
edge-impact-bridge = "edge_lab.bridge:main"
edge-impact-seed-demo = "edge_lab.demo:main"
edge-impact-export = "edge_lab.export:main"
edge-impact-inventory = "edge_lab.inventory:main"
edge-impact-report = "edge_lab.report:main"
edge-impact-doctor = "edge_lab.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bingomate*", "edge_lab*"]
